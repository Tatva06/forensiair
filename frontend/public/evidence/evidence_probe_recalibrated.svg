<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="buffer_beaker" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg_bench)"/>
  
  <!-- Laboratory Bench Top -->
  <rect x="0" y="380" width="800" height="220" fill="#0f172a" stroke="#475569" stroke-width="2"/>

  <!-- Glass Beaker with Calibration Buffer -->
  <rect x="180" y="240" width="220" height="280" rx="12" fill="url(#buffer_beaker)" stroke="#94a3b8" stroke-width="3" filter="url(#shadow2)"/>
  <ellipse cx="290" cy="240" rx="110" ry="20" fill="#bae6fd" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="290" cy="300" rx="100" ry="14" fill="#0284c7" opacity="0.6"/>
  <text x="210" y="470" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold">NIST BUFFER pH 7.00</text>
  <text x="210" y="490" font-family="Arial" font-size="11" fill="#e0f2fe">LOT #B26-8819 • 25.0°C</text>

  <!-- Cleaned Stainless Probe Immersed -->
  <rect x="260" y="80" width="60" height="340" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="270" y="340" width="40" height="70" rx="4" fill="#38bdf8" opacity="0.9" stroke="#0284c7"/>
  <circle cx="290" cy="400" r="14" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>

  <!-- Digital Calibration Transmitter Screen (Yokogawa / Rosemount) -->
  <rect x="460" y="100" width="300" height="240" rx="12" fill="#020617" stroke="#10b981" stroke-width="3" filter="url(#shadow2)"/>
  <rect x="475" y="115" width="270" height="210" rx="6" fill="#064e3b" stroke="#047857"/>
  
  <text x="495" y="145" font-family="monospace" font-size="12" fill="#a7f3d0">YOKOGAWA FLXA21 CAL</text>
  <text x="495" y="195" font-family="monospace" font-size="38" fill="#34d399" font-weight="bold">7.01 pH</text>
  <text x="495" y="225" font-family="monospace" font-size="14" fill="#6ee7b7">TEMP: 24.8°C  •  4.00 mA</text>
  <line x1="495" y1="240" x2="725" y2="240" stroke="#047857" stroke-width="2"/>
  <text x="495" y="265" font-family="monospace" font-size="13" fill="#ffffff" font-weight="bold">SLOPE: 99.4% (PASS)</text>
  <text x="495" y="285" font-family="monospace" font-size="12" fill="#a7f3d0">ZERO DRIFT: +0.01 pH (NORMAL)</text>
  <text x="495" y="305" font-family="monospace" font-size="12" fill="#fef08a">STATUS: RE-COMMISSIONED</text>

  <!-- Evidence Tag -->
  <rect x="460" y="370" width="300" height="140" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="475" y="398" font-family="Arial" font-size="12" fill="#10b981" font-weight="bold">POST-CLEANING VERIFICATION</text>
  <text x="475" y="420" font-family="Arial" font-size="11" fill="#cbd5e1">• Ultrasonic solvent wash completed</text>
  <text x="475" y="438" font-family="Arial" font-size="11" fill="#cbd5e1">• New wiper motor assembly installed</text>
  <text x="475" y="456" font-family="Arial" font-size="11" fill="#cbd5e1">• 3-Point Calibration: pH 4.01, 7.00, 9.21</text>
  <text x="475" y="480" font-family="Arial" font-size="11" fill="#38bdf8" font-weight="bold">Certified by SPCB Inspector &amp; ETP Head</text>

  <!-- Camera HUD -->
  <rect x="20" y="535" width="440" height="45" rx="6" fill="#000000" opacity="0.8"/>
  <text x="35" y="555" font-family="monospace" font-size="11" fill="#f8fafc">MPCB TALOJA • ETP QC LAB-1</text>
  <text x="35" y="570" font-family="monospace" font-size="10" fill="#38bdf8">2026-10-18 14:48:19 IST • CAL CERT #NABL-2026-8819</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cert_sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#cbd5e1"/>

  <!-- Certificate Paper -->
  <rect x="80" y="30" width="640" height="540" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#cert_sh)"/>

  <!-- Border Ornaments -->
  <rect x="95" y="45" width="610" height="510" fill="none" stroke="#00355f" stroke-width="2"/>
  <rect x="99" y="49" width="602" height="502" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Header -->
  <text x="400" y="85" font-family="Arial" font-size="15" fill="#00355f" font-weight="bold" text-anchor="middle">NATIONAL ACCREDITATION BOARD FOR TESTING &amp; CALIBRATION LABORATORIES</text>
  <text x="400" y="105" font-family="Arial" font-size="12" fill="#475569" font-weight="bold" text-anchor="middle">CERTIFICATE OF CALIBRATION &amp; TRACEABILITY</text>
  <text x="400" y="125" font-family="monospace" font-size="10" fill="#dc2626" text-anchor="middle">CERTIFICATE NO: NABL/CAL/2026/MAH-9041 • ACCREDITATION #CC-2891</text>

  <line x1="120" y1="135" x2="680" y2="135" stroke="#00355f" stroke-width="1.5"/>

  <!-- Facility Details -->
  <text x="120" y="160" font-family="Arial" font-size="10" fill="#000000" font-weight="bold">ISSUED TO:</text>
  <text x="210" y="160" font-family="Arial" font-size="10" fill="#334155">M/s RAMDEV CHEMI-Pharma PVT LTD, MIDC Taloja</text>
  <text x="120" y="180" font-family="Arial" font-size="10" fill="#000000" font-weight="bold">INSTRUMENT:</text>
  <text x="210" y="180" font-family="Arial" font-size="10" fill="#334155">Online UV-Vis COD/TSS Spectrophotometer (Probe Model: UV-2000)</text>
  <text x="120" y="200" font-family="Arial" font-size="10" fill="#000000" font-weight="bold">CAL DATE:</text>
  <text x="210" y="200" font-family="Arial" font-size="10" fill="#334155">18-Oct-2026 • DUE DATE: 17-Oct-2027 • TEMP: 25.0 ± 0.5°C</text>

  <!-- Calibration Points Table -->
  <rect x="120" y="220" width="560" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="120" y1="245" x2="680" y2="245" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="130" y="238" font-family="Arial" font-size="9" fill="#475569" font-weight="bold">STANDARD REFERENCE (mg/L)</text>
  <text x="290" y="238" font-family="Arial" font-size="9" fill="#475569" font-weight="bold">INDICATED VALUE</text>
  <text x="420" y="238" font-family="Arial" font-size="9" fill="#475569" font-weight="bold">ERROR (mg/L)</text>
  <text x="530" y="238" font-family="Arial" font-size="9" fill="#475569" font-weight="bold">UNCERTAINTY</text>

  <text x="130" y="270" font-family="monospace" font-size="10" fill="#000">KHP 50.0 mg/L COD</text>
  <text x="290" y="270" font-family="monospace" font-size="10" fill="#000">50.2 mg/L</text>
  <text x="420" y="270" font-family="monospace" font-size="10" fill="#16a34a">+0.2 mg/L</text>
  <text x="530" y="270" font-family="monospace" font-size="10" fill="#000">± 1.2 mg/L</text>

  <text x="130" y="300" font-family="monospace" font-size="10" fill="#000">KHP 250.0 mg/L COD (Limit)</text>
  <text x="290" y="300" font-family="monospace" font-size="10" fill="#000">249.6 mg/L</text>
  <text x="420" y="300" font-family="monospace" font-size="10" fill="#16a34a">-0.4 mg/L</text>
  <text x="530" y="300" font-family="monospace" font-size="10" fill="#000">± 2.8 mg/L</text>

  <text x="130" y="330" font-family="monospace" font-size="10" fill="#000">KHP 500.0 mg/L COD</text>
  <text x="290" y="330" font-family="monospace" font-size="10" fill="#000">501.1 mg/L</text>
  <text x="420" y="330" font-family="monospace" font-size="10" fill="#16a34a">+1.1 mg/L</text>
  <text x="530" y="330" font-family="monospace" font-size="10" fill="#000">± 4.5 mg/L</text>

  <!-- Official Stamps & Signatures -->
  <text x="120" y="400" font-family="Arial" font-size="10" fill="#000000" font-weight="bold">DECLARATION OF CONFORMITY:</text>
  <text x="120" y="418" font-family="Arial" font-size="9" fill="#334155">The measurement results are traceable to National Physical Laboratory (NPL, New Delhi).</text>
  <text x="120" y="432" font-family="Arial" font-size="9" fill="#334155">Instrument optical linearity R² = 0.9998. Conforms to CPCB 2024 OCEMS Guidelines.</text>

  <!-- Blue Seal Stamp -->
  <circle cx="580" cy="460" r="45" fill="none" stroke="#00355f" stroke-width="2"/>
  <circle cx="580" cy="460" r="40" fill="none" stroke="#00355f" stroke-width="1"/>
  <text x="548" y="455" font-family="Arial" font-size="9" fill="#00355f" font-weight="bold">NABL INDIA</text>
  <text x="543" y="470" font-family="Arial" font-size="9" fill="#00355f" font-weight="bold">ACCREDITED</text>

  <line x1="140" y1="500" x2="260" y2="500" stroke="#000" stroke-width="1"/>
  <text x="150" y="515" font-family="Arial" font-size="9" fill="#475569">Calibrated By (Engineer)</text>

  <line x1="340" y1="500" x2="480" y2="500" stroke="#000" stroke-width="1"/>
  <text x="350" y="515" font-family="Arial" font-size="9" fill="#475569">Approved Signatory (Technical Head)</text>
</svg>
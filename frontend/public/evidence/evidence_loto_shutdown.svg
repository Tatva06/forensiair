<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_boiler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="sh_loto" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg_boiler)"/>

  <!-- High Pressure Main Steam Header Pipe -->
  <rect x="0" y="240" width="800" height="120" fill="#475569" stroke="#334155" stroke-width="3"/>
  <line x1="0" y1="260" x2="800" y2="260" stroke="#64748b" stroke-width="6"/>

  <!-- Heavy Flanged Cast Steel Gate Valve Body -->
  <polygon points="260,180 380,300 260,420" fill="#334155" stroke="#1e293b" stroke-width="4"/>
  <polygon points="500,180 380,300 500,420" fill="#334155" stroke="#1e293b" stroke-width="4"/>
  <rect x="360" y="140" width="40" height="180" fill="#64748b" stroke="#334155"/>

  <!-- Red Round Valve Handwheel Secured -->
  <ellipse cx="380" cy="140" rx="90" ry="25" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>

  <!-- Red MasterLock Safety Lockout Hasp -->
  <rect x="340" y="130" width="80" height="70" rx="8" fill="#dc2626" stroke="#991b1b" stroke-width="3" filter="url(#sh_loto)"/>
  <!-- Padlocks Attached (3 Team Member Locks) -->
  <rect x="320" y="170" width="30" height="40" rx="4" fill="#eab308" stroke="#a16207" stroke-width="2"/>
  <rect x="365" y="170" width="30" height="40" rx="4" fill="#eab308" stroke="#a16207" stroke-width="2"/>
  <rect x="410" y="170" width="30" height="40" rx="4" fill="#eab308" stroke="#a16207" stroke-width="2"/>

  <!-- Big Yellow OSHA/CPCB Lockout Tag -->
  <polygon points="460,140 680,140 680,380 460,380" fill="#fef08a" stroke="#ca8a04" stroke-width="3" filter="url(#sh_loto)"/>
  <rect x="475" y="155" width="190" height="40" fill="#dc2626"/>
  <text x="510" y="180" font-family="Arial" font-size="16" fill="#ffffff" font-weight="900">DANGER</text>
  <text x="495" y="210" font-family="Arial" font-size="12" fill="#000000" font-weight="bold">DO NOT OPERATE</text>
  
  <text x="475" y="240" font-family="monospace" font-size="10" fill="#000000" font-weight="bold">EQUIPMENT: BOILER #3</text>
  <text x="475" y="260" font-family="monospace" font-size="10" fill="#000000">REASON: ANNUAL STATUTORY</text>
  <text x="475" y="275" font-family="monospace" font-size="10" fill="#000000">OVERHAUL &amp; HYDRO TEST</text>
  <text x="475" y="300" font-family="monospace" font-size="9" fill="#713f12">LOTO PERMIT #: LOTO-2026-884</text>
  <text x="475" y="315" font-family="monospace" font-size="9" fill="#713f12">START: 2026-10-15 08:00</text>
  <text x="475" y="330" font-family="monospace" font-size="9" fill="#713f12">END:   2026-10-20 18:00</text>
  <text x="475" y="355" font-family="Arial" font-size="10" fill="#15803d" font-weight="bold">MPCB INWARD #RO-MHD-774</text>

  <!-- Regulatory Verification Stamp -->
  <rect x="60" y="50" width="320" height="140" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="75" y="75" font-family="Arial" font-size="12" fill="#10b981" font-weight="bold">VERIFIED LEGITIMATE SHUTDOWN</text>
  <text x="75" y="98" font-family="Arial" font-size="10" fill="#cbd5e1">• Prior 10-day intimation on record at Mahad RO</text>
  <text x="75" y="116" font-family="Arial" font-size="10" fill="#cbd5e1">• Stack emission dropped to 0 due to boiler idle</text>
  <text x="75" y="134" font-family="Arial" font-size="10" fill="#cbd5e1">• CEMS analyzer in zero-gas auto purge</text>
  <text x="75" y="156" font-family="Arial" font-size="11" fill="#34d399" font-weight="bold">VERDICT: FALSE POSITIVE (Operational Overhaul)</text>

  <!-- Camera HUD -->
  <rect x="20" y="540" width="460" height="42" rx="6" fill="#000000" opacity="0.85"/>
  <text x="35" y="558" font-family="monospace" font-size="11" fill="#f8fafc">MAHAD MIDC • M/s.Privi Specialty Chemicals Ltd(Unit-II)</text>
  <text x="35" y="572" font-family="monospace" font-size="10" fill="#38bdf8">2026-10-16 11:10:45 IST • FIELD INSPECTION CONFIRMATION</text>
</svg>
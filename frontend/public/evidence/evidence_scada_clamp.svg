  <text x="640" y="48" font-family="monospace" font-size="11" fill="#38bdf8">NODE: MAHAD-PLC-01</text>

  <!-- Left: Real-time Trend Graph -->
  <rect x="40" y="75" width="350" height="250" fill="#090d16" stroke="#1e293b"/>
  <text x="50" y="95" font-family="Arial" font-size="11" fill="#94a3b8" font-weight="bold">COD TELEMETRY TREND (mg/L) vs CONSENT LIMIT</text>
  <!-- Red Consent Threshold 250 mg/L -->
  <line x1="50" y1="130" x2="380" y2="130" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
  <text x="280" y="125" font-family="Arial" font-size="9" fill="#ef4444" font-weight="bold">LIMIT: 250 mg/L</text>
  
  <!-- The Tampered Clamped Line (flatlined right below 250) -->
  <path d="M 50 240 L 90 230 L 130 190 L 160 134 L 200 134 L 240 133 L 280 134 L 320 133 L 360 134 L 380 133" fill="none" stroke="#f59e0b" stroke-width="3"/>
  
  <!-- The Real Raw Sensor Line (Soaring to 500+ hidden) -->
  <path d="M 160 134 L 190 85 L 240 60 L 290 75 L 340 90 L 380 70" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3" opacity="0.6"/>
  <text x="180" y="80" font-family="monospace" font-size="8" fill="#ef4444">RAW PROBE (485 mg/L)</text>
  <text x="210" y="150" font-family="monospace" font-size="9" fill="#f59e0b" font-weight="bold">TRANSMITTED: 248.1 mg/L CLAMPED</text>

  <!-- Right: Unauthorized Script Editor Window -->
  <rect x="410" y="75" width="355" height="420" rx="6" fill="#1e1e1e" stroke="#ef4444" stroke-width="2" filter="url(#crt)"/>
  <rect x="410" y="75" width="355" height="28" rx="6" fill="#7f1d1d"/>
  <text x="420" y="94" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">SEIZED SCRIPT: cpcb_filter_clamp.lua</text>

  <!-- Code Editor Content with Malicious Formula -->
  <text x="425" y="130" font-family="monospace" font-size="11" fill="#6a9955">-- [UNAUTHORIZED] CPCB limit clamp script</text>
  <text x="425" y="150" font-family="monospace" font-size="11" fill="#6a9955">-- Running on WinCC Gateway Background Task</text>
  <text x="425" y="180" font-family="monospace" font-size="11" fill="#569cd6">function</text>
  <text x="480" y="180" font-family="monospace" font-size="11" fill="#dcdcaa">ProcessTelemetry</text>
  <text x="590" y="180" font-family="monospace" font-size="11" fill="#cccccc">(raw_cod)</text>
  
  <text x="445" y="210" font-family="monospace" font-size="11" fill="#569cd6">local</text>
  <text x="485" y="210" font-family="monospace" font-size="11" fill="#9cdcfe">max_allowed</text>
  <text x="570" y="210" font-family="monospace" font-size="11" fill="#cccccc">=</text>
  <text x="585" y="210" font-family="monospace" font-size="11" fill="#b5cea8">248.5</text>
  
  <!-- Highlighted Tamper Logic -->
  <rect x="420" y="230" width="335" height="50" fill="#ef4444" opacity="0.3"/>
  <text x="445" y="250" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">if raw_cod &gt; max_allowed then</text>
  <text x="465" y="270" font-family="monospace" font-size="11" fill="#fef08a" font-weight="bold">return max_allowed - math.random() * 2.0</text>
  
  <text x="445" y="300" font-family="monospace" font-size="11" fill="#569cd6">else</text>
  <text x="465" y="320" font-family="monospace" font-size="11" fill="#cccccc">return raw_cod</text>
  <text x="445" y="340" font-family="monospace" font-size="11" fill="#569cd6">end</text>
  <text x="425" y="360" font-family="monospace" font-size="11" fill="#569cd6">end</text>

  <rect x="425" y="380" width="325" height="95" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="435" y="405" font-family="Arial" font-size="11" fill="#ef4444" font-weight="bold">FORENSIC AUDIT EVIDENCE MEMO:</text>
  <text x="435" y="425" font-family="Arial" font-size="10" fill="#cbd5e1">• Script intercepts Modbus register 40012</text>
  <text x="435" y="443" font-family="Arial" font-size="10" fill="#cbd5e1">• Enforces ceiling of 248.5 mg/L before cloud push</text>
  <text x="435" y="461" font-family="Arial" font-size="10" fill="#fca5a5" font-weight="bold">• Confessed by Plant Automation Engineer</text>

  <!-- Camera HUD -->
  <rect x="40" y="515" width="450" height="42" rx="6" fill="#000000" opacity="0.9"/>
  <text x="50" y="533" font-family="monospace" font-size="11" fill="#f8fafc">MAHAD MIDC • CONTROL ROOM SCADA AUDIT</text>
  <text x="50" y="547" font-family="monospace" font-size="10" fill="#38bdf8">2026-10-17 15:30:18 IST • sudarshan chemical industries ltd Mahad</text>

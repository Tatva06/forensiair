      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Monitor Bezel -->
  <rect width="800" height="600" fill="#0f172a"/>
  <rect x="20" y="20" width="760" height="560" rx="8" fill="#020617" stroke="#334155" stroke-width="3"/>


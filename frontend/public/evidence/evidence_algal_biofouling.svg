<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#142820"/>
      <stop offset="100%" stop-color="#091410"/>
    </linearGradient>
    <radialGradient id="lens_occlusion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d4a22"/>
      <stop offset="70%" stop-color="#1b3314"/>
      <stop offset="100%" stop-color="#0f1f0a"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background / Tank Water -->
  <rect width="800" height="600" fill="url(#bg_water)"/>
  
  <!-- Aeration Tank Concrete Wall -->
  <rect x="0" y="0" width="800" height="120" fill="#334155"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#475569" stroke-width="4"/>
  <rect x="40" y="20" width="160" height="70" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="50" y="45" font-family="monospace" font-size="11" fill="#94a3b8" font-weight="bold">ETP TANK #2 AERATION</text>
  <text x="50" y="65" font-family="monospace" font-size="10" fill="#38bdf8">MIDC TALOJA • ZONE-3</text>

  <!-- Mounting Pipe / Stainless Steel Boom -->
  <rect x="360" y="0" width="80" height="260" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <line x1="380" y1="0" x2="380" y2="260" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Submerged Sensor Probe Body (Endress+Hauser / Hach Style) -->
  <rect x="340" y="260" width="120" height="220" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="3" filter="url(#shadow)"/>
  <rect x="355" y="280" width="90" height="35" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="365" y="302" font-family="Arial" font-size="10" fill="#f8fafc" font-weight="bold">HACH LDO2-PRO</text>
  
  <!-- Optical Sensing Cap Window -->
  <circle cx="400" cy="480" r="50" fill="url(#lens_occlusion)" stroke="#475569" stroke-width="4"/>
  
  <!-- Heavy Biological Algal Layer Clumping (The Anomaly Cause) -->
  <path d="M 330 430 Q 370 480 340 540 Q 420 530 450 550 Q 480 490 460 420 Q 420 460 380 430 Z" fill="#3b5e2b" opacity="0.95"/>
  <path d="M 360 450 Q 400 520 430 460 Q 460 520 410 540 Q 370 510 360 450 Z" fill="#2d4a22" opacity="0.9"/>
  <circle cx="410" cy="495" r="18" fill="#1e3a16" opacity="0.95"/>
  <circle cx="380" cy="475" r="14" fill="#446e32" opacity="0.85"/>
  <circle cx="430" cy="510" r="12" fill="#2d4a22" opacity="0.9"/>
  
  <!-- Jammed Wiper Mechanism -->
  <line x1="400" y1="440" x2="445" y2="505" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="440" r="8" fill="#475569"/>

  <!-- Evidentiary Callout Box -->
  <rect x="500" y="340" width="270" height="150" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="500" y="340" width="270" height="28" rx="8" fill="#f59e0b"/>
  <text x="512" y="359" font-family="Arial" font-size="12" fill="#000" font-weight="bold">EVIDENCE #1: SENSOR BIO-FOULING</text>
  <text x="512" y="385" font-family="Arial" font-size="11" fill="#f8fafc" font-weight="bold">Anomaly: Optical Flatline (DO: 0.02 mg/L)</text>
  <text x="512" y="405" font-family="Arial" font-size="10" fill="#94a3b8">• Optical window 95% occluded by algae</text>
  <text x="512" y="423" font-family="Arial" font-size="10" fill="#94a3b8">• Wiper drive gear jammed by debris</text>
  <text x="512" y="441" font-family="Arial" font-size="10" fill="#94a3b8">• 4-20mA loop current healthy (4.03 mA)</text>
  <text x="512" y="465" font-family="Arial" font-size="11" fill="#34d399" font-weight="bold">VERDICT: FALSE POSITIVE (Sensor Fault)</text>
  <line x1="500" y1="410" x2="455" y2="480" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>

  <!-- Inspector Scale Bar / Ruler -->
  <rect x="230" y="380" width="30" height="180" fill="#fef08a" stroke="#ca8a04"/>
  <text x="236" y="400" font-family="monospace" font-size="8" fill="#854d0e">0cm</text>
  <text x="236" y="440" font-family="monospace" font-size="8" fill="#854d0e">5cm</text>
  <text x="236" y="480" font-family="monospace" font-size="8" fill="#854d0e">10cm</text>
  <text x="236" y="520" font-family="monospace" font-size="8" fill="#854d0e">15cm</text>
  <text x="236" y="555" font-family="monospace" font-size="8" fill="#854d0e">SCALE</text>

  <!-- Camera HUD / Stamp -->
  <rect x="20" y="530" width="460" height="50" rx="6" fill="#000000" opacity="0.8"/>
  <text x="35" y="550" font-family="monospace" font-size="11" fill="#f8fafc">MPCB TALOJA RO • SURVEILLANCE UNIT-B</text>
  <text x="35" y="568" font-family="monospace" font-size="10" fill="#38bdf8">2026-10-18 11:24:02 IST • GPS: 19.0682°N, 73.1245°E • S/N: ETP-SEN-04</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="macro_sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg_steel)"/>

  <!-- Stainless Steel Enclosure Door & Hinge -->
  <line x1="180" y1="0" x2="180" y2="600" stroke="#1e293b" stroke-width="6"/>
  <rect x="165" y="100" width="30" height="70" rx="4" fill="#94a3b8" stroke="#334155"/>
  <rect x="165" y="430" width="30" height="70" rx="4" fill="#94a3b8" stroke="#334155"/>

  <!-- Padlock Hasp & Door Latch -->
  <rect x="240" y="220" width="160" height="80" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="3" filter="url(#macro_sh)"/>
  <circle cx="350" cy="260" r="18" fill="#475569" stroke="#94a3b8" stroke-width="4"/>

  <!-- Lead Wire CPCB Security Seal (SEVERED) -->
  <!-- Wire Loop Top (Cut End) -->
  <path d="M 350 242 C 340 180, 440 160, 480 220" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <!-- Snip Gap -->
  <circle cx="482" cy="222" r="6" fill="#ef4444"/>
  <!-- Wire Loop Bottom (Hanging) -->
  <path d="M 495 240 C 510 300, 430 350, 430 400" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

  <!-- Red Plastic Barcode Security Seal Body -->
  <rect x="380" y="380" width="130" height="150" rx="10" fill="#dc2626" stroke="#991b1b" stroke-width="3" filter="url(#macro_sh)"/>
  <rect x="395" y="395" width="100" height="35" rx="3" fill="#ffffff"/>
  <!-- Barcode Lines -->
  <line x1="405" y1="405" x2="405" y2="422" stroke="#000" stroke-width="3"/>
  <line x1="412" y1="405" x2="412" y2="422" stroke="#000" stroke-width="1.5"/>
  <line x1="418" y1="405" x2="418" y2="422" stroke="#000" stroke-width="4"/>
  <line x1="426" y1="405" x2="426" y2="422" stroke="#000" stroke-width="2"/>
  <line x1="434" y1="405" x2="434" y2="422" stroke="#000" stroke-width="5"/>
  <line x1="444" y1="405" x2="444" y2="422" stroke="#000" stroke-width="2"/>
  <line x1="452" y1="405" x2="452" y2="422" stroke="#000" stroke-width="4"/>
  <line x1="462" y1="405" x2="462" y2="422" stroke="#000" stroke-width="2"/>
  <line x1="470" y1="405" x2="470" y2="422" stroke="#000" stroke-width="3"/>
  <line x1="478" y1="405" x2="478" y2="422" stroke="#000" stroke-width="1.5"/>
  <text x="402" y="445" font-family="monospace" font-size="11" fill="#ffffff" font-weight="bold">CPCB-MAH-9921</text>
  <text x="402" y="465" font-family="Arial" font-size="9" fill="#fecaca">TAMPER EVIDENT</text>
  <text x="402" y="480" font-family="Arial" font-size="9" fill="#fecaca">GOVT OF INDIA</text>
  <text x="402" y="510" font-family="monospace" font-size="14" fill="#fef08a" font-weight="bold">SEVERED</text>

  <!-- Evidence Callout -->
  <rect x="490" y="60" width="280" height="150" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <rect x="490" y="60" width="280" height="26" rx="8" fill="#ef4444"/>
  <text x="500" y="78" font-family="Arial" font-size="11" fill="#ffffff" font-weight="bold">EVIDENCE #2: PHYSICAL SEAL BREACH</text>
  <text x="500" y="104" font-family="Arial" font-size="10" fill="#f8fafc" font-weight="bold">• CPCB Regulatory Lead Seal Cut</text>
  <text x="500" y="122" font-family="Arial" font-size="10" fill="#94a3b8">• Transmitter box opened without authorization</text>
  <text x="500" y="140" font-family="Arial" font-size="10" fill="#94a3b8">• Tool shear marks visible on steel wire</text>
  <text x="500" y="158" font-family="Arial" font-size="10" fill="#94a3b8">• 4-20mA calibration potentiometers altered</text>
  <text x="500" y="182" font-family="Arial" font-size="11" fill="#f87171" font-weight="bold">VIOLATION: Sec 33A EPA / Water Act 1974</text>
  <line x1="490" y1="130" x2="482" y2="222" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>

  <!-- Camera HUD -->
  <rect x="20" y="540" width="460" height="42" rx="6" fill="#000000" opacity="0.85"/>
  <text x="35" y="558" font-family="monospace" font-size="11" fill="#f8fafc">MACRO INSPECTION PHOTO • ENCLOSURE SEAL #9921</text>
  <text x="35" y="572" font-family="monospace" font-size="10" fill="#38bdf8">2026-10-19 01:42:10 IST • TALOJA MIDC • INVESTIGATOR ID: INSP-7712</text>
</svg>